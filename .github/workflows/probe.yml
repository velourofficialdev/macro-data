name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-uk-ch-nz-rates-cot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python update_data.py | grep -E "YC_(GB|CH|NZ)|POLICY|COT_(EUR|JPY|GBP|CHF|CAD|AUD|NZD)|FAIL"
      - run: |
          for c in GB CH NZ; do echo "== $c"; head -1 data/YC_$c.csv; tail -3 data/YC_$c.csv; wc -l data/YC_$c.csv; done
          python - <<'PY'
          import pandas as pd
          for c in ("GB","CH","NZ"):
              d=pd.read_csv(f"data/YC_{c}.csv",parse_dates=["date"]).set_index("date")
              print(c, d.resample("ME").mean().tail(4).round(3).to_string())
              print(c,"max daily jump 10Y bp:", (d["10Y"].diff().abs().max()*100).round(1), "NaN cols:", d.isna().mean().round(2).to_dict())
          PY
