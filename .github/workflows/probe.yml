name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for s in NZ2Y-NZ NZ3Y-NZ NZ1Y-NZ NZ30Y-NZ CH3Y-CH CH5Y-CH CH7Y-CH CH20Y-CH CH30Y-CH CH1Y-CH; do
            echo "== $s"; curl -s -m 30 -A "$UA" "https://ts-api.cnbc.com/harmony/app/charts/1Y.json?symbol=$s" | head -c 150; echo
          done
          echo "== FRED"; for c in IRLTLT01CHM156N IRLTLT01NZM156N IRSTCI01NZM156N; do curl -s -m 30 -A "$UA" -w " [%{http_code}]\n" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=$c&cosd=2026-06-01" | tail -3; done
          echo "== RBNZ alt"; for u in "https://www.rbnz.govt.nz/statistics/series/exchange-and-interest-rates/wholesale-interest-rates" "https://www.rbnz.govt.nz/-/media/project/sites/rbnz/files/statistics/series/b/b2/hb2-daily-close.xlsx" "https://www.rbnz.govt.nz/-/media/project/sites/rbnz/files/statistics/series/b/b2/hb2-daily-close.csv"; do curl -sL -m 40 -A "$UA" -o /dev/null -w "$u %{http_code} %{size_download}\n" "$u"; done
          echo "== SNB"; for c in rendoblim rendopar; do curl -s -m 40 -A "$UA" "https://data.snb.ch/api/cube/$c/data/csv/en?fromDate=2026-10-01" | head -6; done
          echo "== BIS CH NZ 2Y?"; curl -s -m 30 "https://stats.bis.org/api/v2/data/dataflow/BIS/WS_CBPOL/1.0/D.CH+NZ?lastNObservations=1&format=csv" | cut -d, -f2,11,12
