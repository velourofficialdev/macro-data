name: Probe yield sources (temporary)
on:
  push:
    branches: [probe-sources]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch samples
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (X11; Linux x86_64)"
          for s in DE10Y-DE DE2Y-DE US10Y US2Y FR10Y-FR; do for r in 1Y 1M 5D; do
            curl -s -m 30 -A "$UA" "https://ts-api.cnbc.com/harmony/app/charts/$r.json?symbol=$s" -o "out/cnbc_${s}_$r.json"; done; done
          curl -s -m 30 -A "$UA" "https://www.worldgovernmentbonds.com/country/france/" -o out/wgb_fr.html
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: probe2, path: out }
