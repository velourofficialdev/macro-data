name: Probe yield sources (temporary)
on:
  push:
    branches: [probe-sources]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          probe(){ printf "%s\n  -> " "$1"; curl -s -m 30 -A "Mozilla/5.0 (X11; Linux x86_64)" -o /tmp/o -w "%{http_code} %{size_download} " "$1"; head -c 220 /tmp/o | tr '\n' ' '; echo; }
          for s in 2fry.b 5fry.b 10fry.b 30fry.b 2ity.b 10ity.b 30ity.b 10cny.b 10iny.b 10usy.b; do probe "https://stooq.com/q/d/l/?s=$s&i=d"; done
          probe "https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?symbols=FR10Y-FR|IT10Y-IT|FR2Y-FR|IT2Y-IT&requestMethod=itv&noform=1&partnerId=2&fund=1&exthrs=1&output=json"
          probe "https://ts-api.cnbc.com/harmony/app/charts/5Y.json?symbol=FR10Y-FR"
          probe "https://webstat.banque-france.fr/en/catalog/fm/FM.M.FR.EUR.FR2.BB.FR10YT_RR.YLD"
          probe "https://api.webstat.banque-france.fr/webstat-en/v1/catalogue"
          probe "https://infostat.bancaditalia.it/inquiry/"
          probe "https://www.bancaditalia.it/compiti/operazioni-mef/rendistato-rendiob/index.html"
          probe "https://www.fbil.org.in/wasdm/gsec/fetch?authenticated=false"
          probe "https://yield.chinabond.com.cn/cbweb-mn/yc/queryYz?bjlx=no&&dcq=2,2y;10,10y;&&startTime=2026-10-15&&endTime=2026-10-22&&qxlx=0,&&yqqxN=N&&yqqxK=K&&par=day&&ycDefIds=2c9081e50a2f9606010a3068cae70001,&&locale=en_US"
          probe "https://datacenter-web.eastmoney.com/api/data/v1/get?reportName=RPTA_WEB_TREASURYYIELD&columns=ALL&pageSize=1&sortColumns=SOLAR_DATE&sortTypes=-1"
          probe "https://www.worldgovernmentbonds.com/country/france/"
          probe "https://www.investing.com/rates-bonds/france-10-year-bond-yield-historical-data"
          probe "https://www.boursorama.com/bourse/taux/cours/FR10YT/"
          probe "https://www.aft.gouv.fr/en/main-economic-indicators"
